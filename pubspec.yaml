name: crypto_miner_simulator
description: "An educational cryptocurrency mining simulator game built with Flutter."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.5

  # Local persistent storage
  shared_preferences: ^2.5.3

  # Date, time and number formatting
  intl: ^0.20.2

  # Charts
  fl_chart: ^1.1.1

  # Platform paths and local file locations
  path_provider: ^2.1.5

  # Generate unique identifiers
  uuid: ^4.5.1

  # Useful collection utilities
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/